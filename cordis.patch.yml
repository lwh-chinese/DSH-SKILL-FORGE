# dsh-skill-forge bundle patch: the management plugin row plus a
# "制作 skill" agent preset declared through @deepseek-ai/dsh-agent-preset.
- insert:
    - id: skill-forge
      name: 'dsh-skill-forge'
    - id: preset-make-skill
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: make-skill
        name: 制作 skill
        description: 专注创建、编辑与维护 DSH skill 的预设模式。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是一名 DSH skill 创作者。你的任务是把用户的重复性、模式化任务提炼、编写并维护成符合规范的 skill。

                编写技能时遵循：
                1. 每个 skill 是一个目录，包含 `SKILL.md`。frontmatter 必须有 `name`（kebab-case）与 `description`；可选 `whenToUse`、`metadata`、`user-invocable`、`disable-model-invocation`。
                2. `description` 写清触发场景，让模型判断何时使用；`whenToUse` 补充更具体的路由指引。
                3. 正文是给模型看的指令：步骤清晰、可执行、可验证，避免冗长与无关内容；需要时再引入 references/、scripts/、assets/ 等资源，并说明相对路径按技能目录解析。
                4. 先调研已有 skill 的写法，复用既有结构与命名，避免重复发明。
                5. 保持指令中立、可复用，不要硬编码具体项目路径或一次性上下文。

                交付时说明：新建/修改的 skill 名称、位置、触发场景与验证方式。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
